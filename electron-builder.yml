appId: com.prescribo.desktop
productName: Prescribo
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - electron/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: ./resources
    to: resources
  - from: ../prescribo-app-backend/dist/prescribo-backend
    to: prescribo-app-backend
mac:
  category: public.app-category.medical
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  icon: resources/icon.ico
  # Keep filenames consistent with latest.yml and avoid spaces/dots that
  # confuse electron-updater when artifacts are uploaded manually.
  artifactName: '${productName}-${version}.${ext}'
  target:
    - target: nsis
      arch:
        - x64
    # NOTE: Portable builds do NOT support auto-updates.
    # Users who need auto-updates must install via the NSIS installer.
    - target: portable
      arch:
        - x64
linux:
  icon: resources/icon.png
  category: MedicalSoftware
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish:
  provider: github
  owner: Prescriboo
  repo: Prescribo-app-Frontend
  releaseType: release
nsis:
  # This name is what latest.yml references and what the in-app updater downloads.
  artifactName: '${productName}-Setup-${version}.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
