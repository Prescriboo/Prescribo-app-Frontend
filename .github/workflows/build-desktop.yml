name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            builder_flag: --linux
          - os: windows-latest
            platform: win
            builder_flag: --win
          - os: macos-latest
            platform: mac
            builder_flag: --mac

    steps:
      # =================================================================
      # 1. CHECKOUT REPOSITORIES
      # =================================================================
      # Checkout the Electron/Next.js frontend repo into ./prescribo-nextjs/
      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          path: prescribo-nextjs

      # Checkout the backend repo into ./prescribo-app-backend/ (sibling)
      # Uses a PAT so it works with private repos across different repos.
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/prescribo-app-backend
          token: ${{ secrets.PAT_TOKEN }}
          path: prescribo-app-backend

      # =================================================================
      # 2. SET UP PYTHON & BUILD BACKEND
      # =================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Backend Binary (Linux/macOS)
        if: matrix.platform != 'win'
        working-directory: prescribo-app-backend
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt pyinstaller
          venv/bin/python build.py --clean

      - name: Build Backend Binary (Windows)
        if: matrix.platform == 'win'
        working-directory: prescribo-app-backend
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\pip install --upgrade pip
          venv\Scripts\pip install -r requirements.txt pyinstaller
          venv\Scripts\python build.py --clean

      - name: Verify Backend Binary
        shell: bash
        run: |
          echo "Backend binary location:"
          if [ "${{ matrix.platform }}" == "win" ]; then
            ls -la prescribo-app-backend/dist/prescribo-backend/prescribo-backend.exe
          else
            ls -la prescribo-app-backend/dist/prescribo-backend/prescribo-backend
          fi

      # =================================================================
      # 3. SET UP NODE & BUILD FRONTEND
      # =================================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: prescribo-nextjs/package-lock.json

      - name: Install Dependencies
        working-directory: prescribo-nextjs
        run: npm ci

      - name: Build Next.js Frontend
        working-directory: prescribo-nextjs
        run: npm run build

      # =================================================================
      # 4. PACKAGE ELECTRON
      # =================================================================
      - name: Package Electron
        working-directory: prescribo-nextjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.builder_flag }} --publish=never

      # =================================================================
      # 5. UPLOAD ARTIFACTS
      # =================================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prescribo-${{ matrix.platform }}
          path: |
            prescribo-nextjs/release/*.AppImage
            prescribo-nextjs/release/*.deb
            prescribo-nextjs/release/*.dmg
            prescribo-nextjs/release/*.zip
            prescribo-nextjs/release/*.exe
            prescribo-nextjs/release/*.snap
            prescribo-nextjs/release/latest*.yml
          if-no-files-found: warn

  # ==========================================================================
  # RELEASE JOB: Creates a GitHub Release with all platform artifacts
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required to create GitHub releases
      actions: read        # Required to download artifacts from previous jobs
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      inputs.create_release == true

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prescribo-*
          merge-multiple: false

      - name: Display Downloaded Artifacts
        run: |
          echo "Artifacts ready for release:"
          find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}